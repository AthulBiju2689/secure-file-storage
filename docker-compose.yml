services:

  mysql:
    image: mysql:8.0
    container_name: securefile-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: securefile
    volumes:
      - mysql_data:/var/lib/mysql
      - ./securefile.sql:/docker-entrypoint-initdb.d/securefile.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: secure-file-storage
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  mysql_data:
